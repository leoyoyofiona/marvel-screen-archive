    <radialGradient id="glow"><stop stop-color="hsl(35 92% 70%)" stop-opacity=".72"/><stop offset="1" stop-color="hsl(7 80% 10%)" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
