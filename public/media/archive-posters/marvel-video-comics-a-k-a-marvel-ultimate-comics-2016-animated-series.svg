  <path d="M-80 880 C150 600 380 560 880 170" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
  <path d="M-120 960 C170 640 440 630 920 240" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1"/>
