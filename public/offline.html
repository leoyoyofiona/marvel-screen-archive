<!doctype html>
<html lang="zh-CN">
  <head>

    <title>暂时离线 · 漫威银幕档案</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; color: #eef3fa; background: radial-gradient(circle at 20% 10%, #442431 0, #151d2a 36%, #070b12 76%); font-family: system-ui, sans-serif; }
      main { width: min(620px, 100%); border: 1px solid #3b4657; padding: 42px; background: rgb(8 13 21 / 82%); box-shadow: 0 30px 100px #0008; }
      small { color: #dc5a69; letter-spacing: .14em; }
      h1 { margin: 18px 0 14px; font-size: clamp(28px, 6vw, 48px); font-weight: 560; }
      p { color: #9daabd; line-height: 1.9; }
      button { margin-top: 18px; min-height: 42px; border: 1px solid #8e3b4b; background: #b7253a; color: white; padding: 0 18px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <small>MARVEL SCREEN ARCHIVE / OFFLINE</small>
      <h1>信号暂时离开了银幕。</h1>
      <p>请检查网络后重试。已经打开过的作品页面和本地海报会尽量从设备缓存读取；留言、点赞与访客统计仍需联网。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
